<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guia Interativo: Uso Seguro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        <header>
            <img src="camisinha.jpg" alt="Preservativo" class="header-img">
            <h1>Guia de Uso Seguro</h1>
            <p>Responda às 23 perguntas educativas para gerar seu fluxograma de conhecimento.</p>
        </header>

        <main id="quiz-screen">
            <div class="card">
                <span id="step-badge" class="badge">Pergunta 1 de 23</span>
                <h2 id="question-text">Carregando pergunta...</h2>
                <div id="options-container" class="options-grid"></div>
            </div>
        </main>

        <section id="flowchart-section">
            <h3>Seu Fluxograma Interativo</h3>
            <div id="flowchart" class="flowchart-container">
                <div class="node start">Início</div>
            </div>
        </section>

        <button id="reset-btn" class="hidden" onclick="reiniciar()">Refazer Quiz</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
